name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Comment coverage on PR
        uses: romeovs/lcov-reporter-action@v0.3.1
        with:
          lcov-file: ./coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
          delete-old-comments: true

  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check ESLint
        run: npm run lint

      - name: Validate import positions
        run: npm run validate:imports

      - name: Check for console.* usage
        run: |
          if grep -r "console\." scripts/ --include="*.js" --exclude="logger.js" --exclude="firebase-config.example.js"; then
            echo "❌ Found console.* usage. Please use logger instead."
            exit 1
          else
            echo "✅ No console.* usage found."
          fi

  commit-message:
    name: Commit Message Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        run: |
          echo "Checking commit messages follow Conventional Commits..."

          # Get commit messages in this PR
          git log origin/${{ github.base_ref }}..${{ github.sha }} --pretty=format:"%s" > commits.txt

          # Check format: type(scope): subject or type: subject
          while IFS= read -r msg; do
            # Skip merge commits
            if [[ "$msg" =~ ^Merge ]]; then
              echo "⏭️  Skipping merge commit: $msg"
              continue
            fi

            if [[ ! "$msg" =~ ^(feat|fix|docs|style|refactor|perf|test|chore|ci)(\(.+\))?:.+ ]]; then
              echo "❌ Invalid commit message: $msg"
              echo "Expected format: type(scope): subject"
              echo "Valid types: feat, fix, docs, style, refactor, perf, test, chore, ci"
              exit 1
            fi
          done < commits.txt

          echo "✅ All commit messages are valid"

  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [coverage-report, code-quality, commit-message]
    if: always()

    steps:
      - name: PR Quality Summary
        run: |
          echo "## PR Quality Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Code Quality: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Coverage Report: Generated" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Commit Messages: Valid" >> $GITHUB_STEP_SUMMARY
